name: release

# git push --tags (for example v0.1.0) builds the plugin for every supported
# CPA runtime, creates CPA store-compatible archives and publishes a GitHub
# Release. The registry update is best effort and never blocks the release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PLUGIN_ID: grok-quality-guard
  PLUGIN_NAME: "Grok Quality Guard"
  PLUGIN_AUTHOR: "grok-quality-guard contributors"
  PLUGIN_DESCRIPTION: "Grok account quality guard with passive detection and transparent retry/failover"

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "Building plugin version ${GITHUB_REF_NAME#v}"

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./*.go)"
          if [[ -n "${unformatted}" ]]; then
            printf 'Unformatted Go files:\n%s\n' "${unformatted}" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: dll
            cc: gcc
            cflags: -march=x86-64
            goamd64: v1
            goarm64: ""
            macos_target: ""
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: so
            cc: gcc
            cflags: -march=x86-64
            goamd64: v1
            goarm64: ""
            macos_target: ""
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            ext: so
            cc: aarch64-linux-gnu-gcc
            cflags: -march=armv8-a
            goamd64: ""
            goarm64: v8.0
            macos_target: ""
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
            cc: clang
            cflags: ""
            goamd64: ""
            goarm64: v8.0
            macos_target: "11.0"
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
            cc: clang
            cflags: ""
            goamd64: v1
            goarm64: ""
            macos_target: "11.0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux arm64 cross compiler
        if: ${{ matrix.goos == 'linux' && matrix.goarch == 'arm64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add MinGW to PATH
        if: ${{ matrix.goos == 'windows' }}
        shell: bash
        run: echo "/c/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Build c-shared plugin
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cflags }}
          GOAMD64_OVERRIDE: ${{ matrix.goamd64 }}
          GOARM64_OVERRIDE: ${{ matrix.goarm64 }}
          MACOSX_DEPLOYMENT_TARGET_OVERRIDE: ${{ matrix.macos_target }}
          VERSION: ${{ github.ref_name }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          if [[ -n "${GOAMD64_OVERRIDE}" ]]; then
            export GOAMD64="${GOAMD64_OVERRIDE}"
          fi
          if [[ -n "${GOARM64_OVERRIDE}" ]]; then
            export GOARM64="${GOARM64_OVERRIDE}"
          fi
          if [[ -n "${MACOSX_DEPLOYMENT_TARGET_OVERRIDE}" ]]; then
            export MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET_OVERRIDE}"
          fi
          mkdir -p dist
          version="${VERSION#v}"
          go build -buildmode=c-shared -trimpath -buildvcs=false \
            -ldflags "-X main.pluginVersion=${version}" \
            -o "dist/${PLUGIN_ID}.${EXT}" .

      - name: Upload plugin library
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/grok-quality-guard.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist/artifacts
          pattern: plugin-*

      - name: Package release assets
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          release_dir="dist/release"
          mkdir -p "${release_dir}"
          shopt -s nullglob

          artifact_dirs=(dist/artifacts/plugin-*)
          if [[ ${#artifact_dirs[@]} -ne 5 ]]; then
            echo "Expected 5 platform builds, found ${#artifact_dirs[@]}" >&2
            exit 1
          fi

          for artifact_dir in "${artifact_dirs[@]}"; do
            platform="${artifact_dir##*/plugin-}"
            goos="${platform%%-*}"
            goarch="${platform#*-}"
            mapfile -t libraries < <(find "${artifact_dir}" -maxdepth 1 -type f -print)
            if [[ ${#libraries[@]} -ne 1 ]]; then
              echo "Expected one library in ${artifact_dir}, found ${#libraries[@]}" >&2
              exit 1
            fi
            library="${libraries[0]}"
            extension="${library##*.}"
            archive="${release_dir}/${PLUGIN_ID}_${version}_${goos}_${goarch}.zip"
            python3 - "${library}" "${archive}" "${PLUGIN_ID}-v${version}.${extension}" <<'PY'
          import sys
          import zipfile

          library, archive, library_name = sys.argv[1:4]
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.write(library, arcname=library_name)
          PY
          done

          (cd "${release_dir}" && sha256sum "${PLUGIN_ID}_"*.zip | sort -k2 > checksums.txt)
          echo "Release assets:"
          ls -lh "${release_dir}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/release/*.zip
            dist/release/checksums.txt

      - name: Update plugin registry (best effort)
        continue-on-error: true
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["REF_NAME"].lstrip("v")
          repo = os.environ["REPO"]
          path = Path("registry.json")
          if path.exists():
              registry = json.loads(path.read_text(encoding="utf-8"))
          else:
              registry = {"schema_version": 1, "plugins": []}
          if registry.get("schema_version") not in (1, 2):
              raise SystemExit("unsupported registry schema_version")
          plugins = registry.get("plugins")
          if not isinstance(plugins, list):
              plugins = []
          registry["plugins"] = plugins
          entry = {
              "id": os.environ["PLUGIN_ID"],
              "name": os.environ["PLUGIN_NAME"],
              "description": os.environ["PLUGIN_DESCRIPTION"],
              "author": os.environ["PLUGIN_AUTHOR"],
              "version": version,
              "repository": f"https://github.com/{repo}",
              "logo": f"https://raw.githubusercontent.com/{repo}/{os.environ['DEFAULT_BRANCH']}/assets/logo.png",
              "homepage": f"https://github.com/{repo}#readme",
              "tags": ["grok", "xai", "quality", "resin", "management"],
              "install": {"type": "github-release"},
          }
          for index, plugin in enumerate(plugins):
              if isinstance(plugin, dict) and plugin.get("id") == entry["id"]:
                  plugins[index] = entry
                  break
          else:
              plugins.append(entry)
          path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged"
            exit 0
          fi
          git commit -m "chore: update registry.json for ${REF_NAME}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
